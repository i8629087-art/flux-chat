<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Экран авторизации -->
    <div id="authScreen" class="screen">
        <div class="auth-container">
            <h2>🔥 Flux Chat</h2>
            <input type="text" id="username" placeholder="Имя пользователя">
            <input type="password" id="password" placeholder="Пароль">
            <button onclick="login()">Войти</button>
            <button onclick="register()" class="secondary">Регистрация</button>
            <p id="authError" class="error"></p>
        </div>
    </div>

    <!-- Основной интерфейс -->
    <div id="mainScreen" class="screen" style="display:none">
        <!-- Шапка -->
        <div class="header">
            <div class="user-info">
                <img id="userAvatar" src="" alt="Аватар">
                <span id="userName"></span>
            </div>
            <div class="header-buttons">
                <button id="premiumBtn" onclick="showPremiumModal()" style="display:none">⭐</button>
                <button id="adminBtn" onclick="showAdminPanel()" style="display:none">⚙️</button>
                <button onclick="logout()">🚪</button>
            </div>
        </div>

        <!-- Список чатов -->
        <div class="sidebar">
            <div class="chats-list" id="chatsList"></div>
        </div>

        <!-- Чат -->
        <div class="chat-area">
            <div class="chat-header">
                <span id="currentChatName"></span>
            </div>
            <div class="messages" id="messagesContainer"></div>
            <div class="message-input">
                <input type="text" id="messageInput" placeholder="Введите сообщение...">
                <button onclick="sendMessage()">📤</button>
            </div>
        </div>
    </div>

    <!-- Админ панель -->
    <div id="adminPanel" class="modal" style="display:none">
        <div class="modal-content">
            <h3>👑 Админ панель</h3>
            <div class="admin-tabs">
                <button onclick="showAdminUsers()">Пользователи</button>
                <button onclick="showAdminSettings()">Настройки</button>
            </div>
            <div id="adminContent"></div>
            <button onclick="closeAdminPanel()">Закрыть</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    
    <!-- Основной скрипт -->
    <script src="app.js"></script>
</body>
</html>
